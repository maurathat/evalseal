[project]
name = "evalseal"
version = "0.1.0"
description = "Bind an evaluation result to the configuration that earned it."
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalseal = "evalseal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
